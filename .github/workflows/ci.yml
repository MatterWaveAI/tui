# CI on every push to develop and main and on every pull request into them:
# develop is where the work lands, main is what gets released. The publish
# workflow (publish-pypi.yml) stays tag-only and runs the same gate.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

# The workflow token reads the repository and nothing else; a job that
# needs more says so itself.
permissions:
  contents: read

jobs:
  # What a developer runs before a commit: lint, format and types, once.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tui
    steps:
      # Agent mode needs the SDK's agent contract 1.2, which uv takes from
      # a python-sdk checkout beside this one (pyproject's
      # [tool.uv.sources]) until it is on the SDK's repository at a commit
      # the lockfile can pin; the two checkouts sit side by side here too.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tui
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: MatterWaveAI/python-sdk
          ref: develop
          path: python-sdk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
          enable-cache: true
      # The lockfile is the install: matterwave-sdk resolves from its source
      # (pyproject's [tool.uv.sources]), which pip would not read. The
      # images extra is in, so mypy checks the sixel encoder against
      # Pillow's own types.
      - name: Install
        run: uv sync --locked --extra dev --extra images
      - name: Lint
        run: uv run ruff check .
      - name: No private ticket ids in tracked files
        run: sh scripts/check-ticket-ids.sh
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy --strict

  # The suite on every Python the package supports, on Linux, Windows and
  # macOS: Windows is a terminal the TUI ships for, and the agent's shell
  # tool kills process trees differently on each of the three.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: tui
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: MatterWaveAI/python-sdk
          ref: develop
          path: python-sdk
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install
        run: uv sync --locked --extra dev --extra images
      - name: Test
        run: uv run pytest tests -q --ignore=tests/e2e

  # Every commit on the branch, not just the tip: a secret removed in a
  # later commit is still in the history anyone can clone.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan the history for committed secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git --redact --verbose .
