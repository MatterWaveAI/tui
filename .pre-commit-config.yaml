# `pre-commit install` once per clone; the hooks then run on every commit.
# Gitleaks refuses a commit that adds a secret, before it reaches history.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
