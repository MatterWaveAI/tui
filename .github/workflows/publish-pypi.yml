# Publish matterwave-tui to PyPI. Tag a release (`v0.4.0`) or run it by
# hand; the build job tests and builds, the publish job uploads with OIDC
# trusted publishing -- no token in the repo, the environment holds the
# trust on PyPI's side.
name: publish-pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; the publish job alone widens it, to mint the
# OIDC token PyPI trusts.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev --extra images
      # The same gate as CI's: nothing is published that CI would refuse.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict
      - run: uv run pytest -q --ignore=tests/e2e
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
