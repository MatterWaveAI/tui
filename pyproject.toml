[project]
name = "matterwave-tui"
dynamic = ["version"]
description = "A terminal client for MatterWave chat: the same conversations as the web app"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "matterwave-sdk>=0.5.0",
    "httpx>=0.27",
    "keyring>=25",
    "markdown-it-py>=3",
    "platformdirs>=4",
    "textual>=0.86",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Typing :: Typed",
]

[project.scripts]
matterwave-tui = "matterwave_tui.cli:main"

[project.optional-dependencies]
# The microphone behind dictation; without it, dictation asks for a file.
dictation = ["sounddevice>=0.4"]
# Non-PNG images for the kitty protocol, and sixel encoding; without it,
# PNGs still render on kitty and everything else falls back to text.
images = ["pillow>=10"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The one place the version is written; the package and the User-Agent read it.
path = "src/matterwave_tui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/matterwave_tui"]

[tool.uv.sources]
# matterwave-sdk is not on PyPI. Agent mode imports `matterwave_sdk.agent` at
# agent contract 1.2.0, which is not yet on the SDK's repository, so until it
# is uv resolves the SDK from a python-sdk checkout beside this one that
# carries it (uv.lock records the checkout); then this goes back to a `git`
# source at a pinned `rev`. pip ignores this table, and so does the published
# metadata, which carries only the version range above.
matterwave-sdk = { path = "../python-sdk", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "e2e: drives the TUI against a deployed cluster (needs E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD; skipped otherwise)",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/matterwave_tui"]

[[tool.mypy.overrides]]
# keyring ships no type information.
module = "keyring.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Nor do the optional extras (the dictation microphone, sixel's codec).
module = ["sounddevice.*", "PIL.*"]
ignore_missing_imports = true
