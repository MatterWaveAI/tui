name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The agent's shell tool kills process trees differently on each
    # platform, so the suite runs on all three.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Types
        run: mypy
      - name: Test
        run: pytest tests -q --ignore=tests/e2e
